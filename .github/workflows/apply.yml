name: Apply

# Only a manual dispatch can mutate cloud resources. Both modes use the same
# concurrency group as Destroy, and keep the exact pre-apply plan in the log.
on:
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment architecture
        required: true
        type: choice
        default: lite
        options: [lite, full]
      confirm:
        description: 'Type "typednotes" to confirm a live apply of the selected deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apply-typednotes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: inputs.confirm == 'typednotes'
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      TYPEDNOTES_DEPLOYMENT: ${{ inputs.deployment }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
      SECRETS_BOOTSTRAP_PASSWORD: ${{ secrets.SECRETS_BOOTSTRAP_PASSWORD }}
      LIAISON_ROOT_KEY: ${{ secrets.LIAISON_ROOT_KEY }}
      APP_SECRETS_PASSWORD: ${{ secrets.APP_SECRETS_PASSWORD }}
      LIAISON_SECRETS_PASSWORD: ${{ secrets.LIAISON_SECRETS_PASSWORD }}
      LUN_SECRETS_PASSWORD: ${{ secrets.LUN_SECRETS_PASSWORD }}
      LODE_TOKEN: ${{ secrets.LODE_TOKEN }}
      LUN_TOKEN: ${{ secrets.LUN_TOKEN }}
      LUN_ID_SALT: ${{ secrets.LUN_ID_SALT }}
      COMPUTE_DB_PASSWORD: ${{ secrets.COMPUTE_DB_PASSWORD }}
      GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GITLAB_CLIENT_ID: ${{ secrets.GITLAB_CLIENT_ID }}
      GITLAB_CLIENT_SECRET: ${{ secrets.GITLAB_CLIENT_SECRET }}
      DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
      DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
      SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
      SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      DB_INSPECTOR_USERNAME: ${{ secrets.DB_INSPECTOR_USERNAME }}
      DB_INSPECTOR_PASSWORD: ${{ secrets.DB_INSPECTOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install native FFI dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libssl-dev libsecret-1-dev pkg-config ca-certificates
      - uses: leanprover/lean-action@v1.6.0
      - name: Point OpenSSL at the runner's CA bundle
        run: |
          echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
          echo "SSL_CERT_DIR=/etc/ssl/certs" >> "$GITHUB_ENV"
      - name: Run both fleets' offline checks and Lite supervisor tests
        run: |
          TYPEDNOTES_DEPLOYMENT=lite lake exe typednotes-infra check
          TYPEDNOTES_DEPLOYMENT=full lake exe typednotes-infra check
          python3 -m unittest discover -s lite/tests -v
      - name: Check selected deployment's required secrets
        run: bash scripts/check-deployment-secrets.sh

      # Bake builds all six services from pinned source tags, using their own
      # Dockerfiles. Only the final assembled image is loaded and published.
      - name: Set up Docker Buildx
        if: inputs.deployment == 'lite'
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Export the authored Lite smoke configuration
        if: inputs.deployment == 'lite'
        run: |
          lake env lean --run scripts/lite-config.lean > "$RUNNER_TEMP/lite-config.json"
          docker buildx bake -f lite/docker-bake.hcl --print > "$RUNNER_TEMP/lite-bake.json"
          python3 lite/check-build.py "$RUNNER_TEMP/lite-config.json" "$RUNNER_TEMP/lite-bake.json"
          echo "LITE_IMAGE=ghcr.io/typednotes/typednotes-lite:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Build all services and assemble Lite
        if: inputs.deployment == 'lite'
        uses: docker/bake-action@v7
        with:
          source: .
          files: lite/docker-bake.hcl
          targets: lite
          set: lite.output=type=docker
      - name: Smoke test the combined image against disposable PostgreSQL
        if: inputs.deployment == 'lite'
        run: python3 lite/check-image.py "$LITE_IMAGE" "$RUNNER_TEMP/lite-config.json"
      - name: Log in to GHCR
        if: inputs.deployment == 'lite'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested image and freeze its deployment digest
        if: inputs.deployment == 'lite'
        run: |
          set -euo pipefail
          docker push "$LITE_IMAGE"
          image=$(docker image inspect "$LITE_IMAGE" | jq -er '.[0].RepoDigests[] | select(startswith("ghcr.io/typednotes/typednotes-lite@sha256:"))')
          echo "TYPEDNOTES_LITE_IMAGE=$image" >> "$GITHUB_ENV"
          docker tag "$LITE_IMAGE" ghcr.io/typednotes/typednotes-lite:latest
          docker push ghcr.io/typednotes/typednotes-lite:latest
          # Infra and Scaleway pull anonymously. New GHCR packages need a
          # one-time public-visibility change; catch that before cloud creation.
          token=$(curl -fsS 'https://ghcr.io/token?service=ghcr.io&scope=repository:typednotes/typednotes-lite:pull' | jq -er .token)
          curl -fsSI -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/typednotes/typednotes-lite/manifests/${image##*@}" > /dev/null
          echo "### Tested Lite image: $image" >> "$GITHUB_STEP_SUMMARY"

      # One environment and one immutable image reference for all three calls.
      # Pipefail prevents tee from hiding a failed plan.
      - name: Plan
        run: |
          set -o pipefail
          {
            echo "### Plan being applied ($TYPEDNOTES_DEPLOYMENT)"
            echo '```'
            lake exe typednotes-infra plan --refresh-secrets
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply
        run: lake script run apply --yes --refresh-secrets
      - name: Verify convergence
        run: |
          set -o pipefail
          {
            echo "### State after apply ($TYPEDNOTES_DEPLOYMENT)"
            echo '```'
            lake exe typednotes-infra plan --refresh-secrets
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
