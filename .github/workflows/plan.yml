name: Plan

on:
  push:
  pull_request:
  workflow_dispatch:

# Never runs `push --apply`. This workflow only ever shows what *would*
# change; applying lives in `apply.yml`, which has no push trigger at all and
# must be dispatched by hand.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Same native FFI dependency set as `infra`'s own CI, for the same reason:
      # `Infra` pulls in all of Linen's `extern_lib`, not just the parts this
      # fleet touches. See `infra`'s `lean_action_ci.yml` for the fuller
      # explanation (`System.Keychain`/libsecret, libpq, OpenSSL headers).
      - name: Install native FFI dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libssl-dev libsecret-1-dev pkg-config ca-certificates
      - uses: leanprover/lean-action@v1
      # Lean's toolchain bundles a *static* OpenSSL whose compile-time
      # `OPENSSLDIR` points at whatever machine built it, so on a fresh runner
      # there is no trust store and every certificate fails to verify with
      # "certificate verify failed". `SSL_CTX_set_default_verify_paths` — which
      # is what Linen's TLS client calls — honours these two variables, so this
      # points it at the runner's own bundle. See `infra`'s
      # `docs/authentication.md`.
      - name: Point OpenSSL at the runner's CA bundle
        run: |
          for f in /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt; do
            if [ -f "$f" ]; then echo "SSL_CERT_FILE=$f" >> "$GITHUB_ENV"; break; fi
          done
          echo "SSL_CERT_DIR=/etc/ssl/certs" >> "$GITHUB_ENV"
      # Offline, no credentials needed or available. Runs on every push and PR.
      - name: Run offline self-checks
        run: lake exe typednotes-infra check

      # Live plan: push to `main` only. Scaleway credentials only — `Infra.Cli`
      # authenticates just the clouds the fleet declares into (`Keys.providers`),
      # and `pullEntries` skips `(provider, kind)` pairs with no keys, so this
      # fleet never calls AWS and never needs AWS secrets configured.
      - name: Plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_REGION: ${{ secrets.SCW_DEFAULT_REGION }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
        run: |
          {
            echo '```'
            lake exe typednotes-infra plan
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
