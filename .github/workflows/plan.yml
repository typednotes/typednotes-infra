name: Plan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment architecture
        required: true
        type: choice
        default: current
        options: [current, lite, full-from-lite, full]
      lite_image:
        description: 'For full-from-lite: the currently deployed Lite image pinned with @sha256'
        required: false
        type: string

permissions:
  contents: read

# Never runs `apply`. This workflow only ever shows what *would*
# change; applying lives in `apply.yml`, which has no push trigger at all and
# must be dispatched by hand.
jobs:
  configuration:
    uses: ./.github/workflows/deployment-config.yml
    with:
      deployment: ${{ inputs.deployment || 'current' }}
      lite_image: ${{ inputs.lite_image || '' }}
      operation: plan
  build:
    needs: configuration
    runs-on: ubuntu-latest
    env:
      TYPEDNOTES_DEPLOYMENT: ${{ needs.configuration.outputs.deployment }}
      TYPEDNOTES_LITE_IMAGE: ${{ needs.configuration.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      # Strict static typing of the Python under images/, lite/, local/ and
      # scripts/ (`mypy.ini`). Before the Lean build, so it fails fast. A venv
      # because the runner's system Python is externally managed (PEP 668);
      # mypy is pinned so a new release cannot turn CI red on its own.
      - name: Type-check the Python (mypy --strict)
        run: |
          python3 -m venv "$RUNNER_TEMP/mypy"
          "$RUNNER_TEMP/mypy/bin/pip" install --quiet mypy==2.4.1
          "$RUNNER_TEMP/mypy/bin/mypy"
      # Same native FFI dependency set as `infra`'s own CI, for the same reason:
      # `Infra` pulls in all of Linen's `extern_lib`, not just the parts this
      # fleet touches. See `infra`'s `lean_action_ci.yml` for the fuller
      # explanation (`System.Keychain`/libsecret, libpq, OpenSSL headers).
      - name: Install native FFI dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev postgresql libssl-dev libsecret-1-dev pkg-config ca-certificates
      # `--wfail`: a warning, including `sorry`, fails the build.
      - uses: leanprover/lean-action@v1.6.0
        with:
          build-args: "--wfail"
      # Lean's toolchain bundles a *static* OpenSSL whose compile-time
      # `OPENSSLDIR` points at whatever machine built it, so on a fresh runner
      # there is no trust store and every certificate fails to verify with
      # "certificate verify failed". `SSL_CTX_set_default_verify_paths` — which
      # is what Linen's TLS client calls — honours these two variables, so this
      # points it at the runner's own bundle. See `infra`'s
      # `docs/authentication.md`.
      - name: Point OpenSSL at the runner's CA bundle
        run: |
          for f in /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt; do
            if [ -f "$f" ]; then echo "SSL_CERT_FILE=$f" >> "$GITHUB_ENV"; break; fi
          done
          echo "SSL_CERT_DIR=/etc/ssl/certs" >> "$GITHUB_ENV"
      # Offline, no credentials needed or available. Runs on main and PRs to main.
      - name: Run offline self-checks
        run: |
          TYPEDNOTES_DEPLOYMENT=lite lake exe typednotes-infra check
          TYPEDNOTES_DEPLOYMENT=full lake exe typednotes-infra check
          TYPEDNOTES_DEPLOYMENT=full-from-lite lake exe typednotes-infra check
          TYPEDNOTES_DEPLOYMENT=lite-storage lake exe typednotes-infra check
          lake env lean --run scripts/check-topology.lean
          LOCAL_POSTGRES_BIN="$(pg_config --bindir)" python3 -m unittest discover -s lite/tests -v
          python3 -m unittest discover -s images/tests -v
          LOCAL_POSTGRES_BIN="$(pg_config --bindir)" python3 -m unittest discover -s local/tests -v
          lake env lean --run scripts/lite-config.lean > "$RUNNER_TEMP/lite-config.json"
          jq -e --slurpfile actual "$RUNNER_TEMP/lite-config.json" '.vaultIdentities == $actual[0].vaultIdentities' images/vault-identities.json

      # Live plan: push to `main` only. Scaleway credentials only. The fleet
      # declares nothing on AWS; `accounts` names it, so without AWS
      # credentials here the plan prints a note that AWS is not scanned and
      # goes on. On Scaleway every kind is listed, declared or not, to find
      # resources carrying this fleet's marker that the declaration no longer
      # names — so the key needs read access across the project.
      - name: Plan
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
        run: |
          # `{ … } | tee` exits with tee's status, and Actions' `bash -e` does
          # not set pipefail — so without this a failing `plan` reports green.
          # Run 35922722580 did exactly that: the plan hit `403 AccessDenied`
          # and the step passed. `apply.yml` and `destroy.yml` already had it.
          set -o pipefail
          {
            echo '```'
            lake exe typednotes-infra plan
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
