name: Plan

on:
  push:
  pull_request:
  workflow_dispatch:

# Never runs `push --apply` — that stays a manual, human-triggered step (local,
# or `lake exe typednotes-infra push --apply` run by hand). This workflow only
# ever shows what *would* change.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Same native FFI dependency set as `infra`'s own CI, for the same reason:
      # `Infra` pulls in all of Linen's `extern_lib`, not just the parts this
      # fleet touches. See `infra`'s `lean_action_ci.yml` for the fuller
      # explanation (`System.Keychain`/libsecret, libpq, OpenSSL headers).
      - name: Install native FFI dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libssl-dev libsecret-1-dev pkg-config
      - uses: leanprover/lean-action@v1
      # Offline, no credentials needed or available. Runs on every push and PR.
      - name: Run offline self-checks
        run: lake exe typednotes-infra check

      # Live plan: push to `main` only. `liveFromEnvironment` unconditionally
      # loads credentials for *both* clouds (see `Infra.Providers.liveFromEnvironment`),
      # even though this fleet only manages Scaleway resources today — so both
      # sets of repo secrets must exist, even though the AWS ones are never
      # exercised by anything this fleet declares. This is a known ergonomic
      # gap in `infra` itself, not something worked around here.
      - name: Plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_REGION: ${{ secrets.SCW_DEFAULT_REGION }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
        run: |
          {
            echo '```'
            lake exe typednotes-infra plan
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
