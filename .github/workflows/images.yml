name: Combined images

on:
  push:
    branches: [main]
    paths: ['images/**', 'local/**', 'lite/**', 'scripts/build-images.sh', '.dockerignore', '.github/workflows/images.yml']
  schedule:
    - cron: '7,22,37,52 * * * *'
  repository_dispatch:
    types: [service-version-updated]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if these service versions were already published
        type: boolean
        default: false
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
    outputs:
      lite:
        description: Published Lite image pinned by digest
        value: ${{ jobs.publish.outputs.lite }}
      local:
        description: Published Local image pinned by digest
        value: ${{ jobs.publish.outputs.local }}

permissions:
  contents: read
  packages: write

# Both architectures and variants are promoted together after their smoke tests.
# Source-version notifications only wake the resolver: no payload becomes code,
# a repository URL, a build ref, or a shell command.
concurrency:
  # Reusable calls inherit the caller's workflow name. Keep manual Apply out
  # of the scheduled publisher's one-pending-run slot, which cron can replace.
  group: combined-images-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decision.outputs.changed }}
      key: ${{ steps.refs.outputs.key }}
      build_id: ${{ steps.decision.outputs.build_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Find newest stable tags of all six services
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m images.releases --refs-only --output .images --revision "$GITHUB_SHA"
          echo "key=$(jq -r .key .images/refs.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: .images
          key: combined-images-${{ steps.refs.outputs.key }}
      - name: Resolve matching SQL only when a rebuild is needed
        id: decision
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          FORCE: ${{ inputs.force || false }}
        run: |
          changed=false
          if [ "$CACHE_HIT" != true ] || [ "$FORCE" = true ]; then
            python3 -m images.releases --output .images --refs-file .images/refs.json --revision "$GITHUB_SHA"
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "build_id=$(jq -r .build_id .images/manifest.json)" >> "$GITHUB_OUTPUT"
          jq -r '.sources | to_entries[] | "* \(.key): \(.value.tag) @ \(.value.commit)"' .images/manifest.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: combined-source-bundle
          path: .images/
          include-hidden-files: true
          retention-days: 7

  build:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      PLATFORM: linux/${{ matrix.arch }}
      LITE_IMAGE: ghcr.io/typednotes/typednotes-lite:build-${{ needs.resolve.outputs.build_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      LOCAL_IMAGE: ghcr.io/typednotes/typednotes-local:build-${{ needs.resolve.outputs.build_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: combined-source-bundle
          path: .images
      - name: Install native FFI dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libssl-dev libsecret-1-dev pkg-config ca-certificates
      - uses: leanprover/lean-action@v1.6.0
      - name: Verify source manifest, policy correspondence and bootstrap tests
        run: |
          python3 -m unittest discover -s lite/tests -v
          python3 -m unittest discover -s images/tests -v
          python3 -m unittest discover -s local/tests -v
          lake env lean --run scripts/lite-config.lean > "$RUNNER_TEMP/lite-config.json"
          jq -e --slurpfile actual "$RUNNER_TEMP/lite-config.json" '.vaultIdentities == $actual[0].vaultIdentities' images/vault-identities.json
          docker buildx bake -f lite/docker-bake.hcl -f .images/bake.json --print > "$RUNNER_TEMP/bake.json"
          python3 lite/check-build.py .images/manifest.json "$RUNNER_TEMP/bake.json"
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Build both variants from the same resolved source snapshot
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            lite/docker-bake.hcl
            .images/bake.json
          targets: lite,local
          pull: ${{ inputs.force || false }}
          no-cache: ${{ inputs.force || false }}
          set: |
            lite.output=type=docker
            local.output=type=docker
      - name: Smoke test Lite with external PostgreSQL
        run: python3 lite/check-image.py "$LITE_IMAGE" .images/manifest.json
      - name: Smoke test self-contained Local and container recreation
        run: python3 local/check-image.py "$LOCAL_IMAGE"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested native-architecture images
        run: |
          docker push "$LITE_IMAGE"
          docker push "$LOCAL_IMAGE"

  publish:
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      lite: ${{ steps.images.outputs.lite }}
      local: ${{ steps.images.outputs.local }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: combined-source-bundle
          path: .images
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote both tested architectures and return exact digests
        id: images
        env:
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
          BUILD_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          CHANGED: ${{ needs.resolve.outputs.changed }}
          PROMOTE_LATEST: ${{ github.workflow == 'Combined images' }}
        run: |
          set -euo pipefail
          for variant in lite local; do
            image="ghcr.io/typednotes/typednotes-$variant"
            if [ "$CHANGED" = true ]; then
              unique="$image:build-$BUILD_ID-$BUILD_RUN"
              docker buildx imagetools create --tag "$unique" \
                "$image:build-$BUILD_ID-$BUILD_RUN-amd64" "$image:build-$BUILD_ID-$BUILD_RUN-arm64"
              digest=$(docker buildx imagetools inspect "$unique" --format '{{.Manifest.Digest}}')
              tags=(--tag "$image:build-$BUILD_ID")
              # An older, slower Apply must not roll the standalone publisher's
              # latest pointer backwards. Apply consumes its own exact digest.
              if [ "$PROMOTE_LATEST" = true ]; then tags+=(--tag "$image:latest"); fi
              docker buildx imagetools create "${tags[@]}" "$image@$digest"
            else
              digest=$(docker buildx imagetools inspect "$image:build-$BUILD_ID" --format '{{.Manifest.Digest}}')
              if [ "$PROMOTE_LATEST" = true ]; then
                docker buildx imagetools create --tag "$image:latest" "$image@$digest"
              fi
            fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "$variant=$image@$digest" >> "$GITHUB_OUTPUT"
            echo "* $variant: $image@$digest" >> "$GITHUB_STEP_SUMMARY"
          done
      # This is a rebuild cache, not deployment state. Losing/evicting it just
      # repeats a build; successful image digests always come from the registry.
      - uses: actions/cache/save@v4
        if: needs.resolve.outputs.changed == 'true'
        with:
          path: .images
          key: combined-images-${{ needs.resolve.outputs.key }}
