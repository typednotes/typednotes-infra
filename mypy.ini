# Strict static typing for the repository's Python (CI: plan.yml).
# `explicit_package_bases`: `lite/` and `local/` are namespace packages, and
# both hold a `check-image.py` script, so modules are named from the repository
# root (run `mypy` from there).
[mypy]
python_version = 3.12
strict = True
explicit_package_bases = True
files = images, lite, local, scripts/*.py
